; PlatformIO project config for Dumm-E's firmware
;
; NOTE: "board" is set to the generic "esp32dev" (most common ESP32 DevKit
; boards). If your specific board isn't recognized correctly, run
; `pio boards esp32` to list valid board IDs and update this.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^1.1.1
